name: one-time-github-compat-fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace GitHub loader
        env:
          REPLACEMENT_B64: 
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          replacement = base64.b64decode("").decode("utf-8")
          path = Path("src/DevDock.tsx")
          content = path.read_text()
          start = content.index("  async function loadGithubOverview(")
          end = content.index("  async function saveGithub()", start)
          path.write_text(content[:start] + replacement + content[end:])
          PY

      - name: Commit and remove workflow
        run: |
          rm .github/workflows/one-time-github-compat-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DevDock.tsx .github/workflows/one-time-github-compat-fix.yml
          git commit -m "restore public GitHub access and private fallback"
          git push
