name: one-time-devdock-typescript-fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'fix DevDock GitHub TypeScript nullability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix target project nullability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/DevDock.tsx")
          content = path.read_text()

          old = """  async function loadGithubOverview(targetProject: Project | null = project) {
    const repo = targetProject?.github_repo?.trim()"""
          new = """  async function loadGithubOverview(targetProject: Project | null = project) {
    const projectId = targetProject?.id;
    const repo = targetProject?.github_repo?.trim()"""

          if old not in content:
              raise SystemExit("Expected loadGithubOverview declaration not found.")

          content = content.replace(old, new, 1)

          old = "        const { data, error: functionError } = await supabase.functions.invoke('github-private-overview-v2', {\n          body: { project_id: targetProject.id },"
          new = "        const { data, error: functionError } = await supabase.functions.invoke('github-private-overview-v2', {\n          body: { project_id: projectId },"

          if old not in content:
              raise SystemExit("Expected private GitHub function call not found.")

          content = content.replace(old, new, 1)

          old = "    if (!repo || !/^[^/]+\\/[^/]+$/.test(repo)) {"
          new = "    if (!projectId || !repo || !/^[^/]+\\/[^/]+$/.test(repo)) {"

          if old not in content:
              raise SystemExit("Expected repository validation not found.")

          content = content.replace(old, new, 1)

          path.write_text(content)
          PY

      - name: Remove workflow and commit fix
        run: |
          rm .github/workflows/one-time-devdock-typescript-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DevDock.tsx .github/workflows/one-time-devdock-typescript-fix.yml
          git commit -m "fix DevDock GitHub TypeScript nullability"
          git push
